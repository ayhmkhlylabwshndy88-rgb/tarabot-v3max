<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#b8860b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="صفحة الطالب - تحميل الشهادة من منصة ترابط">

    <title>ترابط - تحميل الشهادة</title>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- المكتبات -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- التصميم -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/student.css">
</head>
<body class="student-body">

    <!-- شاشة البداية -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">🕌</div>
            <h1 class="splash-title">ترابط</h1>
            <p class="splash-subtitle">تحميل الشهادات</p>
            <div class="splash-loader">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- الصفحة -->
    <div class="student-page" id="studentPage">

        <!-- الهيدر -->
        <header class="student-header">
            <div class="student-brand">
                <div class="student-logo">🕌</div>
                <div class="student-brand-text">
                    <h1>ترابط</h1>
                    <span>تحميل الشهادات</span>
                </div>
            </div>
            <button class="student-theme-btn" id="themeBtn" aria-label="الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <!-- البطل -->
        <section class="student-hero">
            <div class="student-hero-icon">🎓</div>
            <h2>ابحث عن شهادتك</h2>
            <p>اكتب اسمك الكامل للبحث عن شهادتك وتحميلها</p>
        </section>

        <!-- البحث -->
        <section class="student-search-section">
            <div class="student-search-box">
                <i class="fas fa-search"></i>
                <input type="text"
                       id="studentSearch"
                       placeholder="اكتب اسمك الكامل..."
                       autocomplete="off"
                       autofocus>
                <button class="student-clear-btn" id="clearBtn" aria-label="مسح">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </section>

        <!-- النتائج -->
        <section class="student-results" id="resultsSection">
            <div class="student-empty" id="emptyState">
                <i class="fas fa-user-graduate"></i>
                <h3>ابدأ بكتابة اسمك</h3>
                <p>سيظهر لك زر التحميل بعد العثور على شهادتك</p>
            </div>
        </section>

        <!-- الأزرار الجماعية -->
        <section class="student-bulk" id="bulkSection" style="display: none;">
            <div class="student-divider">
                <span>أو</span>
            </div>
            <button class="student-bulk-btn" id="downloadAllBtn">
                <i class="fas fa-file-archive"></i>
                <div>
                    <strong>تحميل جميع الشهادات</strong>
                    <span>ملف ZIP يحتوي على كل الشهادات</span>
                </div>
            </button>
        </section>

        <!-- الفوتر -->
        <footer class="student-footer">
            <p>© <span id="year"></span> منصة ترابط — نبني جسور المعرفة معاً</p>
        </footer>

    </div>

    <!-- الإشعارات -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- شاشة التحميل -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p class="loading-text" id="loadingText">جاري المعالجة...</p>
            <div class="loading-progress">
                <div class="loading-progress-fill" id="loadingProgressFill"></div>
            </div>
            <span class="loading-percent" id="loadingPercent">0%</span>
        </div>
    </div>

    <!-- السكربتات -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/certificate.js"></script>
    <script src="js/export.js"></script>
    <script src="js/student.js"></script>

</body>
</html>
